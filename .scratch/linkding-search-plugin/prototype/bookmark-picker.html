<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — Linkding Bookmark Picker</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.4 system-ui, sans-serif; --bg:#10131a; --panel:#1b202b; --panel2:#252c3a; --text:#f2f5fb; --muted:#9ba7bb; --accent:#8bd5ca; --warn:#ffd580; --danger:#ff9b9b; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 10% 0%, #263343, var(--bg) 48%); color:var(--text); display:grid; place-items:center; padding:32px 20px 90px }
    button, input { font:inherit }
    button { color:inherit; border:0; cursor:pointer }
    .stage { width:min(860px, 100%); position:relative }
    .eyebrow { color:var(--accent); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 8px }
    h1 { font-size:22px; margin:0 0 18px }
    .bar { display:flex; align-items:center; gap:8px; height:48px; margin-bottom:14px; color:var(--muted) }
    .bar .brand { font-weight:650; color:var(--text); margin-right:auto }
    .bar .status { display:flex; align-items:center; gap:7px; font-size:12px }
    .dot { width:8px; height:8px; border-radius:50%; background:#6ce0b2; box-shadow:0 0 10px #6ce0b2 }
    .dot.offline { background:var(--danger); box-shadow:0 0 10px var(--danger) }
    .surface { min-height:460px; background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid #313b4c; border-radius:18px; box-shadow:0 22px 80px #0008; overflow:hidden }
    .search { display:flex; align-items:center; gap:12px; padding:16px 20px; background:#171c26; border-bottom:1px solid #313b4c }
    .search .key { color:var(--muted); font-size:18px }
    .search input { width:100%; color:var(--text); background:transparent; outline:0; border:0; font-size:19px }
    .search input::placeholder { color:#718096 }
    .hint { color:var(--muted); font-size:12px; white-space:nowrap }
    .rows { padding:8px }
    .row { display:flex; align-items:flex-start; gap:12px; padding:13px 14px; border-radius:11px; margin:2px 0; cursor:pointer }
    .row:hover, .row.selected { background:var(--panel2) }
    .favicon { display:grid; place-items:center; width:28px; height:28px; border-radius:7px; background:#364258; color:var(--accent); flex:none; font-size:13px; font-weight:700 }
    .row-main { min-width:0; flex:1 }
    .title { font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .meta { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px }
    .tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:7px }
    .tag { color:#c2cde0; background:#303b4d; padding:2px 6px; border-radius:5px; font-size:11px }
    .action { color:var(--muted); background:transparent; border:1px solid #3c475a; border-radius:7px; padding:5px 8px; font-size:12px; white-space:nowrap }
    .action:hover { color:var(--text); border-color:var(--accent) }
    .footer { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; padding:12px 18px; border-top:1px solid #313b4c }
    .footer kbd, kbd { background:#303949; border:1px solid #4a5669; border-radius:4px; padding:1px 5px; color:var(--text) }
    .empty, .error, .loading { display:grid; place-items:center; min-height:320px; padding:30px; text-align:center; color:var(--muted) }
    .empty strong, .error strong, .loading strong { display:block; color:var(--text); margin-bottom:5px }
    .error strong { color:var(--danger) }
    .spinner { color:var(--accent); font-size:28px; margin-bottom:10px }
    .variant-a .surface { max-width:720px; margin:auto }
    .variant-a .row { padding:15px }
    .variant-b { display:grid; grid-template-columns:1fr 290px; gap:12px }
    .variant-b .surface { min-height:460px }
    .preview { border-left:1px solid #313b4c; background:#171c26; padding:24px; display:flex; flex-direction:column; gap:15px }
    .preview h2 { margin:0; font-size:17px }
    .preview .url { color:var(--accent); word-break:break-all; font-size:13px }
    .preview .desc { color:var(--muted); font-size:13px }
    .preview .big-action { margin-top:auto; background:var(--accent); color:#13211f; border-radius:8px; padding:11px; font-weight:700 }
    .variant-c .surface { display:grid; grid-template-columns:220px 1fr; min-height:460px }
    .groups { background:#171c26; padding:16px 10px }
    .groups h2 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; padding:0 10px; margin:5px 0 12px }
    .group { padding:10px; border-radius:8px; color:var(--muted); cursor:pointer }
    .group.active, .group:hover { color:var(--text); background:var(--panel2) }
    .group span { float:right; color:#738198 }
    .variant-c .content { min-width:0 }
    .switcher { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:14px; padding:9px 13px; border:1px solid #556277; border-radius:999px; background:#141a24ee; box-shadow:0 8px 30px #0008; z-index:5 }
    .switcher button { width:26px; height:26px; border-radius:50%; background:#303b4d }
    .switcher button:hover { background:#43516a }
    .switcher .label { min-width:185px; text-align:center; font-size:12px }
    .note { color:var(--muted); font-size:12px; margin-top:13px }
    .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#d7fff2; color:#13211f; padding:9px 14px; border-radius:8px; font-weight:650; opacity:0; pointer-events:none; transition:opacity .2s }
    .toast.show { opacity:1 }
    @media (max-width:700px) { .variant-b, .variant-c .surface { display:block } .preview, .groups { border:0; border-bottom:1px solid #313b4c } .preview { min-height:210px } .groups { display:flex; gap:5px; overflow:auto } .groups h2 { display:none } .group { white-space:nowrap } .hint { display:none } }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">PROTOTYPE — throwaway UI</p>
    <h1>Linkding Bookmark Picker</h1>
    <div class="bar"><span class="brand">Omarchy bar · Linkding</span><span class="status"><i class="dot" id="dot"></i><span id="status">Linkding reachable</span></span></div>
    <div id="app"></div>
    <p class="note">Mock data only. Try typing, ↑/↓, Enter, Ctrl+C, Escape, and the bottom switcher. Use <code>?variant=A</code>, <code>B</code>, or <code>C</code> in the URL.</p>
  </main>
  <div class="toast" id="toast"></div>
  <nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span class="label" id="variant-label"></span><button id="next" aria-label="Next variant">→</button></nav>
  <script>
    const bookmarks = [
      {title:'Omarchy Plugins', url:'https://omarchyplugins.com/develop.html', domain:'omarchyplugins.com', tags:['omarchy','reference'], desc:'Build and publish extensions for the Omarchy shell.'},
      {title:'Linkding API documentation', url:'https://linkding.link/api/', domain:'linkding.link', tags:['linkding','api'], desc:'Authentication, bookmark search, and pagination.'},
      {title:'Quickshell Process docs', url:'https://quickshell.org/docs/master/typescript/', domain:'quickshell.org', tags:['qml','shell'], desc:'Process boundaries and UI integration notes.'},
      {title:'Personal reading queue', url:'https://example.com/reading', domain:'example.com', tags:['later'], desc:'A saved bookmark with no special state.'}
    ];
    const names = {A:'A — Compact command palette', B:'B — List + detail preview', C:'C — Groups and results'};
    let variant = new URLSearchParams(location.search).get('variant') || 'A';
    if (!names[variant]) variant='A';
    let query='', selected=0, state='ready';
    const filtered = () => bookmarks.filter(b => (b.title+' '+b.url+' '+b.domain+' '+b.tags.join(' ')+' '+b.desc).toLowerCase().includes(query.toLowerCase()));
    const row = (b, i, actions=true) => `<div class="row ${i===selected?'selected':''}" data-index="${i}" tabindex="0"><div class="favicon">${b.domain[0].toUpperCase()}</div><div class="row-main"><div class="title">${b.title}</div><div class="meta">${b.domain} · ${b.desc}</div><div class="tags">${b.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div></div>${actions?`<button class="action" data-action="copy" data-index="${i}">Copy URL</button>`:''}</div>`;
    const search = () => `<div class="search"><span class="key">⌕</span><input id="query" autofocus placeholder="Search all Linkding bookmarks…" value="${query}"><span class="hint">↵ open · ⌃C copy</span></div>`;
    const body = (kind) => { if(state==='loading') return `<div class="loading"><div><div class="spinner">◌</div><strong>Loading bookmarks…</strong>Fetching active and archived results</div></div>`; if(state==='error') return `<div class="error"><div><strong>Linkding unavailable</strong>Check your connection or run <code>linkding-setup</code>.</div></div>`; const fs=filtered(); if(!fs.length) return `<div class="empty"><div><strong>No bookmarks found</strong>Try a title, domain, tag, or URL.</div></div>`; return kind==='rows'?`<div class="rows">${fs.map(row).join('')}</div>`:fs.map(row).join(''); };
    function render(){ const fs=filtered(); const picked=fs[selected]||fs[0]; document.getElementById('variant-label').textContent=names[variant]; document.getElementById('app').className='variant-'+variant.toLowerCase(); let html=''; if(variant==='A') html=`<section class="surface"><div>${search()}${body('rows')}</div><div class="footer"><span>${fs.length} bookmarks · active + archived</span><span><kbd>↑↓</kbd> navigate <kbd>Esc</kbd> close</span></div></section>`; if(variant==='B') html=`<section class="surface"><div>${search()}${body('rows')}</div><aside class="preview">${picked?`<div class="eyebrow">Selected bookmark</div><h2>${picked.title}</h2><div class="url">${picked.url}</div><p class="desc">${picked.desc}</p><div class="tags">${picked.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div><button class="big-action" data-action="open">Open in default browser ↵</button>`:'<div class="empty">Select a bookmark</div>'}</aside></section>`; if(variant==='C') html=`<section class="surface"><aside class="groups"><h2>Views</h2><div class="group active">All bookmarks <span>${bookmarks.length}</span></div><div class="group">Recent <span>4</span></div><div class="group">Archived <span>1</span></div></aside><div class="content">${search()}${body('rows')}<div class="footer"><span>Search is Linkding-native</span><span><kbd>Ctrl+C</kbd> copy</span></div></div></section>`; document.getElementById('app').innerHTML=html; const input=document.getElementById('query'); if(input){ input.oninput=e=>{query=e.target.value;selected=0;render(); document.getElementById('query').focus();}; input.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();selected=Math.min(selected+1,filtered().length-1);render();document.getElementById('query').focus()} if(e.key==='ArrowUp'){e.preventDefault();selected=Math.max(selected-1,0);render();document.getElementById('query').focus()} if(e.key==='Enter'&&filtered()[selected]) act('open',selected); if(e.key==='Escape') toast('Picker closed (prototype)'); if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&filtered()[selected]) act('copy',selected)} }; document.querySelectorAll('.row').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.index);render()}); document.querySelectorAll('[data-action]').forEach(el=>el.onclick=e=>{e.stopPropagation();act(el.dataset.action, Number(el.dataset.index))}); }
    function act(action,i){const b=filtered()[i];if(!b)return;if(action==='copy'){navigator.clipboard?.writeText(b.url);toast('URL copied — picker closed (prototype)')}else toast('Opening '+b.domain+' in default browser (prototype)')}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    function setVariant(v){variant=v;history.replaceState({},'',location.pathname+'?variant='+v);selected=0;render()}
    document.getElementById('prev').onclick=()=>setVariant(variant==='A'?'C':String.fromCharCode(variant.charCodeAt(0)-1)); document.getElementById('next').onclick=()=>setVariant(variant==='C'?'A':String.fromCharCode(variant.charCodeAt(0)+1)); document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')setVariant(variant==='A'?'C':String.fromCharCode(variant.charCodeAt(0)-1));if(e.key==='ArrowRight')setVariant(variant==='C'?'A':String.fromCharCode(variant.charCodeAt(0)+1)}); render();
  </script>
</body>
</html>
